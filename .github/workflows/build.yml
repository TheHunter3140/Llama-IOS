name: Build Pal IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Récupérer llama.xcframework depuis la release deps-1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download deps-1 \
            --repo "${{ github.repository }}" \
            --pattern 'llama-b12130-xcframework.zip' \
            --dir deps
          unzip -q deps/llama-b12130-xcframework.zip -d deps/unzipped
          FW=$(find deps/unzipped -name llama.xcframework -type d | head -n 1)
          test -n "$FW" || { echo "llama.xcframework introuvable dans le zip"; exit 1; }
          mv "$FW" ./llama.xcframework
          ls -la llama.xcframework

      - name: Vérifier les fichiers du projet
        run: |
          test -f project.yml || { echo "project.yml manquant à la racine"; exit 1; }
          ls Sources

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler (sans signature)
        run: |
          set -o pipefail
          xcodebuild \
            -project Pal.xcodeproj \
            -scheme Pal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Afficher les erreurs de compilation
        if: failure()
        run: |
          echo "=== ERREURS ==="
          grep -n -E "error:|ld: |Undefined symbol" build.log | sort -u | head -n 40

      - name: Créer l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Pal.app Payload/
          zip -qry Pal.ipa Payload

      - name: Publier l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pal-ipa-unsigned
          path: Pal.ipa

      - name: Publier le log de compilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
