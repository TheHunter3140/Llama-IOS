name: Build Pal IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pal-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Download llama.cpp iOS XCFramework (latest release that has one)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          R=ggml-org/llama.cpp
          TAG=""
          for t in $(gh release list --repo $R --limit 20 --json tagName -q '.[].tagName'); do
            A=$(gh release view "$t" --repo $R --json assets -q '.assets[].name')
            if echo "$A" | grep -qi xcframework; then TAG="$t"; break; fi
          done
          [ -n "$TAG" ] || { echo "Aucune release avec XCFramework" >&2; exit 1; }
          echo "Version utilisée : $TAG"
          mkdir -p vendor/download vendor/unpacked
          gh release download "$TAG" --repo $R --pattern '*xcframework*' --dir vendor/download
          for f in vendor/download/*; do
            case "$f" in
              *.zip) unzip -q "$f" -d vendor/unpacked ;;
              *.tar.gz|*.tgz) tar -xzf "$f" -C vendor/unpacked ;;
            esac
          done
          FRAMEWORK_DIR="$(find vendor/unpacked -type d -name 'llama.xcframework' -print -quit)"
          [ -n "$FRAMEWORK_DIR" ] || { echo "llama.xcframework introuvable" >&2; find vendor/unpacked -maxdepth 4; exit 1; }
          ditto "$FRAMEWORK_DIR" ./llama.xcframework

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iOS devices (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project Pal.xcodeproj \
            -scheme Pal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Pal.app"
          test -d "$APP_PATH"
          rm -rf Payload Pal.ipa
          mkdir Payload
          ditto "$APP_PATH" "Payload/Pal.app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Pal.ipa
          test -s Pal.ipa

      - name: Upload IPA and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pal-ipa-unsigned
          path: |
            Pal.ipa
            build/Logs/Build/*.xcactivitylog
          if-no-files-found: warn
          retention-days: 14
